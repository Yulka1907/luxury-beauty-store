<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Карточка товара</title>
    <link rel="stylesheet" href="product.css">
</head>

<body>
    <header class="header">
        <h2 class="logo">BeautyShop</h2>
        <nav class="nav">
            <a href="main.html">Главная</a>
            <a href="cataloge.html">Каталог</a>
            <a href="cart.html">Корзина</a>
            <a href="profile.html">Профиль</a>
        </nav>
    </header>
    <div class="product-page">
        <img src="https://i.letu.ru/common/img/pim/2025/01/AUX_35b234dd-fa36-4774-9660-8da743691afb.jpg" width="300"
            height="300" class=".product-page-img
" alt="Товар">
        <h2 class="product-title">Увлажняющий крем </h2>
        <p class="product-price">1 290 p</p>
        <div class="product-rating">⭐⭐⭐⭐⭐</div>
        <p class="product-desc">
            Лёгкий увлажняющий крем для ежедневного ухода. Подходит для всех типов кожи.
        </p>
        <button class="product-btn" onclick="addToCart()">Добавить в корзину</button>

    </div>
    <a href="cataloge.html" class="back-btn">Назад</a>
    <script>
        function addToCart() {
            let cart = JSON.parse(localStorage.getItem("cart")) || [];

            const product = {
                title: "Увлажняющий крем",
                price: 1290,
                img: "https://i.letu.ru/common/img/pim/2025/01/AUX_35b234dd-fa36-4774-9660-8da743691afb.jpg"
            };

            cart.push(product);
            localStorage.setItem("cart", JSON.stringify(cart));

            alert("Товар добавлен в корзину!");
        }
    </script>
</body>

</html>
